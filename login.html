<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Nhà Thông Minh v1</title>
    <!-- File CSS riêng biệt -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header-logo">
                <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </div>

            <h1 class="login-title">Nhà Thông Minh v1</h1>
            <p class="login-sub">Chọn tài khoản thành viên trong gia đình để truy cập hệ thống điều khiển</p>

            <div style="display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:1.5rem; flex-wrap:wrap;">
                <span class="status-pill online" id="loginStatusPill">
                    <span class="dot"></span>
                    <span>Cloud Firestore: Sẵn sàng</span>
                </span>
                <button class="btn-action" style="background:var(--accent-primary); color:#ffffff; font-weight:700; border-color:var(--accent-primary); padding:0.45rem 1.1rem;" onclick="quickLoginAdmin()">
                    ⚡ Đăng Nhập Nhanh (Admin) &rarr;
                </button>
            </div>

            <!-- LƯỚI DANH SÁCH TÀI KHOẢN NGƯỜI DÙNG TRONG GIA ĐÌNH -->
            <div class="profile-select-grid" id="loginProfileGrid">
                <!-- Được render tự động qua JavaScript từ Cloud Firestore -->
                <div style="grid-column:1/-1; text-align:center; padding:2rem; color:var(--text-muted);">
                    Đang tải danh sách thành viên từ Cloud Firestore...
                </div>
            </div>

            <!-- CÁC NÚT TIỆN ÍCH DƯỚI BẢNG ĐĂNG NHẬP -->
            <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:1.5rem; border-top:1px solid var(--card-border); padding-top:1.25rem;">
                <button class="btn-action" onclick="openAddMemberLoginModal()">
                    + Thêm Thành Viên Mới
                </button>
                <button class="btn-action" onclick="SmartHomeFirebase.seedDefaultFamilyMembers()">
                    🔥 Khởi Tạo Mẫu Firestore
                </button>
                <a href="index.html" class="btn-action" style="text-decoration:none;">
                    Bỏ Qua &rarr; Vào Trang Chủ
                </a>
            </div>
        </div>
    </div>

    <!-- ==================================================================
         MODAL THÊM THÀNH VIÊN MỚI TRỰC TIẾP TRÊN TRANG ĐĂNG NHẬP
         ================================================================== -->
    <div class="modal-overlay" id="addMemberLoginModalOverlay">
        <div class="modal-card" style="max-width:480px; text-align:left;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem;">
                <h3 style="font-size:1.15rem; font-weight:700;">Thêm Thành Viên Vào Gia Đình</h3>
                <span style="font-size:1.5rem; cursor:pointer; color:var(--text-muted);" onclick="closeAddMemberLoginModal()">&times;</span>
            </div>

            <form onsubmit="handleNewMemberLoginSubmit(event)">
                <div class="form-group">
                    <label class="form-label">Họ và tên thành viên *</label>
                    <input type="text" id="loginNewName" class="form-input" placeholder="Ví dụ: Trần Thị Mai, Nguyễn Hoàng Nam..." required>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <div class="form-group">
                        <label class="form-label">Vai trò trong gia đình</label>
                        <select id="loginNewRole" class="form-select">
                            <option value="user">Người dùng (User)</option>
                            <option value="admin">Quản trị viên (Admin)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mối quan hệ</label>
                        <input type="text" id="loginNewRelation" class="form-input" placeholder="Bố, Mẹ, Con trai, Con gái...">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" id="loginNewPhone" class="form-input" placeholder="0912 xxx xxx">
                </div>

                <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:1.25rem;">
                    <button type="button" class="btn-action" onclick="closeAddMemberLoginModal()">Hủy</button>
                    <button type="submit" class="btn-action" style="background:var(--accent-primary); color:#ffffff; border-color:var(--accent-primary);">
                        Lưu Lên Cloud Firestore
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Khay Toast Thông Báo -->
    <div class="toast-box" id="globalToastBox"></div>

    <!-- Thư viện Firebase SDK Compat cho trình duyệt -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- File Cấu hình & Đồng bộ Firebase -->
    <script src="js/firebase-config.js"></script>
    <!-- File JavaScript Core ứng dụng -->
    <script src="js/app.js"></script>

    <!-- Script Xử Lý Đăng Nhập Profile -->
    <script>
        let selectedMemberForLogin = null;

        // Render các thẻ profile tài khoản
        function renderLoginProfiles(members) {
            const container = document.getElementById('loginProfileGrid');
            if (!container) return;

            const list = (members && members.length > 0) ? members : (AppCore.state.familyMembers || []);
            container.innerHTML = '';

            list.forEach(m => {
                const isAdmin = (m.role === 'admin');
                const card = document.createElement('div');
                card.className = 'profile-card';
                card.onclick = () => executeLogin(m);

                card.innerHTML = `
                    <div class="profile-avatar-circle" style="background: ${m.avatarColor || (isAdmin ? '#2563eb' : '#059669')};">
                        ${m.name ? m.name.charAt(0).toUpperCase() : 'U'}
                    </div>
                    <div class="profile-name">${m.name}</div>
                    <div class="profile-relation">${m.relationship || (isAdmin ? 'Chủ hộ' : 'Thành viên')}</div>
                    <div class="profile-card-footer" style="margin-bottom:0.75rem;">
                        <span class="user-role-tag ${isAdmin ? 'admin' : 'user'}">
                            ${isAdmin ? 'Admin' : 'User'}
                        </span>
                    </div>
                    <button class="btn-action" style="width:100%; justify-content:center; background:var(--accent-primary); color:#ffffff; border-color:var(--accent-primary); font-size:0.8rem; padding:0.45rem;">
                        Đăng Nhập &rarr;
                    </button>
                `;

                container.appendChild(card);
            });
        }

        // Thực thi đăng nhập và chuyển sang trang chủ NGAY LẬP TỨC
        function executeLogin(member) {
            console.log("🚀 Thực thi đăng nhập vào:", member.name);

            // 1. Lưu thông tin người dùng vào localStorage
            AppCore.state.currentUser = member;
            try {
                localStorage.setItem('smarthome_current_user', JSON.stringify(member));
            } catch(e) {}

            // 2. Ghi nhận thời gian hoạt động & sự kiện đăng nhập lên Cloud Firestore (chạy ngầm)
            if (window.SmartHomeFirebase && typeof window.SmartHomeFirebase.loginUserToFirestore === 'function') {
                window.SmartHomeFirebase.loginUserToFirestore(member).catch(err => {
                    console.warn("Lỗi Firestore đăng nhập (bỏ qua):", err);
                });
            }

            // 3. Chuyển hướng sang trang chủ index.html NGAY LẬP TỨC
            window.location.href = 'index.html';
        }

        // Nút đăng nhập nhanh quyền Admin
        function quickLoginAdmin() {
            const adminMember = (AppCore.state.familyMembers && AppCore.state.familyMembers.find(m => m.role === 'admin')) 
                || { id: "admin_default", name: "Nguyễn Văn An", role: "admin", relationship: "Chủ hộ / Bố", avatarColor: "#2563eb" };
            executeLogin(adminMember);
        }

        // Modal thêm thành viên trực tiếp trên trang đăng nhập
        function openAddMemberLoginModal() {
            document.getElementById('addMemberLoginModalOverlay').classList.add('active');
        }

        function closeAddMemberLoginModal() {
            document.getElementById('addMemberLoginModalOverlay').classList.remove('active');
        }

        async function handleNewMemberLoginSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('loginNewName').value.trim();
            const role = document.getElementById('loginNewRole').value;
            const relation = document.getElementById('loginNewRelation').value.trim();
            const phone = document.getElementById('loginNewPhone').value.trim();

            if (!name) return;

            const newMem = {
                name: name,
                role: role,
                relationship: relation || (role === 'admin' ? 'Chủ hộ' : 'Thành viên'),
                phone: phone || 'Chưa cập nhật',
                status: 'online',
                avatarColor: role === 'admin' ? '#2563eb' : '#ec4899',
                can_unlock_door: true,
                can_trigger_alarm: (role === 'admin')
            };

            if (window.SmartHomeFirebase && window.SmartHomeFirebase.firestore) {
                await window.SmartHomeFirebase.addFamilyMember(newMem);
            } else {
                newMem.id = "local_" + Date.now();
                AppCore.state.familyMembers.push(newMem);
                renderLoginProfiles(AppCore.state.familyMembers);
            }

            closeAddMemberLoginModal();
            document.getElementById('loginNewName').value = '';
        }

        // Khởi động khi tải xong trang login
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('smarthome_theme') || 'villa';
            document.body.classList.add('theme-' + savedTheme);

            // Khi Firebase Firestore tải xong, render danh sách thành viên
            setTimeout(() => {
                renderLoginProfiles(AppCore.state.familyMembers);
            }, 500);

            // Hoặc nếu Firestore kích hoạt callback
            if (window.SmartHomeFirebase) {
                SmartHomeFirebase.listenToFamilyMembers((members) => {
                    renderLoginProfiles(members);
                });
            }
        });
    </script>
</body>
</html>
